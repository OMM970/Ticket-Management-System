version: '3.8'

services:



  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped


  booking:
    build: ./BookingService
    container_name: booking-service
    ports:
      - "2019:2019"
    environment:
      MONGO_URI: ${MONGO_URI}/booking_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongo
      - redis
      - kafka
    restart: unless-stopped

  inventory:
    build: ./Inventory_Service
    container_name: inventory-service
    ports:
      - "9090:9090"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_service_FMS
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    restart: unless-stopped

  customer:
    build: ./CustomerManagementService
    container_name: customer-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/customer_service_FMS
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka
    restart: unless-stopped

  payment:
    build: ./PaymentService
    container_name: payment-service
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: ${MONGO_URI}/payment_db
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      BOOKING_SERVICE_URL: http://booking:2019
    depends_on:
      - mongo
      - booking
    restart: unless-stopped

  notification:
    build: ./Notification-Service
    container_name: notification-service
    ports:
      - "9093:9093"
    environment:
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      KAFKA_SERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

  gateway:
    build: ./Gateway
    container_name: gateway
    ports:
      - "2000:2000"
    environment:
      INVENTORY_URL: http://inventory:9090
      CUSTOMER_URL: http://customer:8083
      BOOKING_URL: http://booking:2019
      PAYMENT_URL: http://payment:8080
    depends_on:
      - booking
      - inventory
      - customer
      - payment
    restart: unless-stopped



volumes:
  mongo-data:
  postgres-data:

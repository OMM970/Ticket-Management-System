spring:
  application:
    name: inventory-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true

  cache:
    type: redis

server:
  port: ${PORT:9090}
